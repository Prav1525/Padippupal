name: Android production lesson-image acceptance

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-image-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Install screenshot inspection dependency
        run: python3 -m pip install --user --disable-pip-version-check Pillow

      - name: Validate proxy and emulator scripts
        run: |
          set -euo pipefail
          bash -n .github/scripts/android-production-image-smoke.sh
          bash -n .github/scripts/android_activity_package.sh
          bash -n .github/scripts/test_android_activity_package.sh
          bash .github/scripts/test_android_activity_package.sh
          python3 -m py_compile .github/scripts/production_image_smoke_proxy.py .github/scripts/test_production_image_smoke_proxy.py .github/scripts/ui_smoke.py
          python3 .github/scripts/test_production_image_smoke_proxy.py
          python3 .github/scripts/test_ui_smoke_helpers.py

      - name: Wake production API (health only)
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 18); do
            if curl --connect-timeout 10 --max-time 30 -fsS https://padippupal-curriculum-api.onrender.com/health; then
              ready=1
              break
            fi
            echo "Production API not ready (attempt $attempt/18); retrying."
            sleep 10
          done
          test "$ready" -eq 1

      - name: Start local read-only production image proxy
        run: |
          set -euo pipefail
          python3 .github/scripts/production_image_smoke_proxy.py --host 0.0.0.0 --port 8765 > production-image-proxy.log 2>&1 &
          echo $! > production-image-proxy.pid
          ready=0
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error --max-time 2 http://127.0.0.1:8765/health; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" -eq 1

      - name: Run fast Android JVM tests
        run: gradle --no-daemon -PPADIPPUPAL_API_BASE_URL=http://10.0.2.2:8765 testDebugUnitTest

      - name: Build debug APK against the read-only image proxy
        run: gradle --no-daemon -PPADIPPUPAL_API_BASE_URL=http://10.0.2.2:8765 assembleDebug

      - name: Enable KVM hardware acceleration for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -e /dev/kvm && ls -l /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm

      - name: Launch Android emulator and verify both production images render inline
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          system-image-api-level: 35
          target: google_apis
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -no-snapshot-save -gpu swiftshader_indirect -memory 2048 -cores 2
          disable-animations: true
          emulator-boot-timeout: 420
          script: |
            echo "Checking emulator acceleration from the SDK provisioned by android-emulator-runner"
            "$ANDROID_HOME/emulator/emulator" -accel-check
            bash .github/scripts/android-tts-preflight.sh
            bash .github/scripts/android-production-image-smoke.sh

      - name: Assert production proxy fetched both paired images with no writes
        if: always()
        run: |
          set -euo pipefail
          curl --retry 5 --retry-delay 2 --retry-connrefused --fail --silent http://127.0.0.1:8765/__test/report > production-image-proxy-report.json
          python3 - <<'PY'
          import json
          with open("production-image-proxy-report.json", encoding="utf-8") as handle:
              report = json.load(handle)
          ids = set(report.get("verified_image_ids", []))
          if report.get("manifest_requests", 0) < 1:
              raise SystemExit("FAIL: Android did not request the production lesson image manifest")
          if len(ids) != 2:
              raise SystemExit(f"FAIL: expected two production PNG GETs, got {len(ids)} unique IDs")
          if len(report.get("expected_titles", [])) != 2:
              raise SystemExit("FAIL: production manifest did not identify both paired images")
          if report.get("errors"):
              raise SystemExit("FAIL: production image proxy errors: " + "; ".join(report["errors"]))
          if report.get("production_writes") != 0:
              raise SystemExit("FAIL: production write attempts were recorded")
          print("PASS: both production paired PNGs were fetched and integrity-verified; no production writes.")
          PY

      - name: Upload production tutor screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: padippupal-production-image-emulator
          path: |
            ui-screenshots/production-image/
            production-image-proxy.log
            production-image-proxy-report.json
          if-no-files-found: warn
          retention-days: 14
