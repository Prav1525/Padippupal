name: Android UI smoke test

on:
  push:
    branches: ["main", "feature/gentle-ai-tutor", "fix/all-test-failures"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

# Keep only the newest emulator run for this branch; cold Android emulators are expensive.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Record runner resources
        run: |
          echo "Runner CPU count: $(nproc)"
          free -h
          df -h "$GITHUB_WORKSPACE"

      - name: Enable KVM hardware acceleration
        run: |
          # The hosted runner has /dev/kvm, but the prior logs showed the job user
          # lacked permission, forcing the emulator to start with -accel off.
          if [ ! -e /dev/kvm ]; then
            echo "::error::/dev/kvm is unavailable on this runner; hardware acceleration cannot be enabled."
            exit 1
          fi
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 0666 /dev/kvm
          ls -l /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Install screenshot inspection dependency
        run: python3 -m pip install --user --disable-pip-version-check Pillow

      - name: Validate smoke-test scripts
        run: |
          bash -n .github/scripts/android-ui-smoke.sh
          python3 -m py_compile .github/scripts/ui_smoke.py
          python3 .github/scripts/ui_smoke.py --validate-dispatch

      - name: Launch app in Android emulator and test navigation
        timeout-minutes: 12
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # API 30's SystemUIService repeatedly ANR'd during first boot on the hosted
          # runner before the app was installed. Move UI testing to the maintained
          # Google APIs image and the emulator runner's indirect SwiftShader path.
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -cores 2 -memory 3072
          # Keep system/app animations off to reduce focus and UI synchronization flakiness.
          disable-animations: true
          emulator-boot-timeout: 900
          script: bash .github/scripts/android-ui-smoke.sh

      - name: Upload emulator screenshots, UI trees, and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: padippupal-emulator-ui
          path: |
            ui-screenshots/
            home.xml
            tutor.xml
            home-return.xml
            feedback.xml
            settings.xml
            chapter-options.xml
            chapter-menu.xml
            chapter-selected.xml
            ready-to-teach.xml
            live-lesson.xml
          if-no-files-found: warn
          retention-days: 14
