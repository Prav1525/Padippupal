name: Android UI smoke test

on:
  push:
    branches: ["main", "feature/gentle-ai-tutor", "feature/diary-crop-rescan", "fix/diary-image-picker-reliability"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

# Keep only the newest emulator run for this branch; cold Android emulators are expensive.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - id: jvm_tests
        name: Run fast JVM tests before emulator allocation
        run: gradle --no-daemon -PPADIPPUPAL_API_BASE_URL=http://10.0.2.2:8765 testDebugUnitTest

      - id: apk_build
        name: Build debug APK
        run: gradle --no-daemon -PPADIPPUPAL_API_BASE_URL=http://10.0.2.2:8765 assembleDebug

      - name: Install screenshot inspection dependency
        run: python3 -m pip install --user --disable-pip-version-check Pillow

      - id: script_validation
        name: Validate smoke-test scripts
        run: |
          bash -n .github/scripts/android-ui-smoke.sh
          bash -n .github/scripts/android-tts-preflight.sh
          bash -n .github/scripts/diary_crop_emulator_test.sh
          python3 -m py_compile .github/scripts/write_test_failure_report.py .github/scripts/test_diary_emulator_script.py .github/scripts/ui_smoke.py .github/scripts/test_ui_smoke_helpers.py .github/scripts/tutor_smoke_api.py .github/scripts/test_diary_crop_contract.py .github/scripts/create_diary_test_fixture.py
          python3 .github/scripts/test_diary_crop_contract.py
          python3 .github/scripts/test_diary_emulator_script.py
          python3 .github/scripts/test_ui_smoke_helpers.py
          python3 .github/scripts/tutor_smoke_api.py --self-test

      - name: Enable KVM hardware acceleration for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -e /dev/kvm && ls -l /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm

      # Use a deterministic local API fixture rather than production Render.
      # The emulator must test this PR's client behavior, not a separately deployed
      # main-branch backend or mutable curriculum data.
      - name: Start deterministic tutor smoke API
        run: |
          python3 .github/scripts/tutor_smoke_api.py --host 0.0.0.0 --port 8765 > /tmp/padippupal-smoke-api.log 2>&1 &
          echo $! > /tmp/padippupal-smoke-api.pid
          ready=0
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error --max-time 2 http://127.0.0.1:8765/health -o /tmp/padippupal-health.json; then
              cat /tmp/padippupal-health.json
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" -eq 1

      - id: emulator_test
        name: Launch app in Android emulator and test navigation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          system-image-api-level: 30
          target: google_apis
          profile: pixel_2
          # Keep the guest memory modest so the emulator does not starve the hosted runner.
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -no-snapshot-save -gpu swiftshader_indirect -memory 2048 -cores 2
          disable-animations: true
          emulator-boot-timeout: 420
          script: |
            echo "Checking emulator acceleration from the SDK provisioned by android-emulator-runner"
            "$ANDROID_HOME/emulator/emulator" -accel-check
            # Install a checksum-verified, offline TTS engine from F-Droid's
            # signed repository index. This works even when the emulator image
            # ships with no TTS service and does not depend on Play Store sign-in.
            bash .github/scripts/android-tts-preflight.sh
            bash .github/scripts/android-ui-smoke-retry.sh
            bash .github/scripts/diary_crop_emulator_test.sh

      - name: Record test outcomes and failure diagnostics
        if: always()
        env:
          JVM_TESTS_OUTCOME: ${{ steps.jvm_tests.outcome }}
          APK_BUILD_OUTCOME: ${{ steps.apk_build.outcome }}
          SCRIPT_VALIDATION_OUTCOME: ${{ steps.script_validation.outcome }}
          EMULATOR_TEST_OUTCOME: ${{ steps.emulator_test.outcome }}
        run: python3 .github/scripts/write_test_failure_report.py

      - name: Upload emulator screenshots, UI trees, and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: padippupal-emulator-ui
          path: |
            ui-screenshots/
            attempt-artifacts/
            test-failure-report.md
            home.xml
            home-return.xml
            feedback.xml
            settings.xml
            chapter-options.xml
            chapter-menu.xml
            chapter-selected.xml
            ready-to-teach.xml
            live-lesson.xml
            live-paused.xml
            live-resumed.xml
            live-complete.xml
            ui-screenshots/live-complete.png
          if-no-files-found: warn
          retention-days: 14