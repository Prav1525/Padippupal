name: Android UI smoke test

on:
  push:
    branches: ["main", "feature/gentle-ai-tutor"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

# Keep only the newest emulator run for this branch; cold Android emulators are expensive.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Run fast JVM tests before emulator allocation
        run: gradle --no-daemon testDebugUnitTest

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Install screenshot inspection dependency
        run: python3 -m pip install --user --disable-pip-version-check Pillow

      - name: Validate smoke-test scripts
        run: |
          bash -n .github/scripts/android-ui-smoke.sh
          python3 -m py_compile .github/scripts/ui_smoke.py .github/scripts/test_ui_smoke_helpers.py
          python3 .github/scripts/test_ui_smoke_helpers.py

      - name: Enable KVM hardware acceleration for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -e /dev/kvm && ls -l /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm

      # Render's free instance sleeps when idle. Wake it before the cold emulator
      # reaches the tutor flow so the first curriculum request isn't mistaken for an
      # empty chapter list. Require a real health response; never silently skip warmup.
      - name: Wake curriculum API and wait for readiness
        run: |
          ready=0
          for attempt in $(seq 1 10); do
            if curl --fail --silent --show-error --max-time 15 \
              "https://padippupal-curriculum-api.onrender.com/health" -o /tmp/padippupal-health.json; then
              cat /tmp/padippupal-health.json
              ready=1
              break
            fi
            echo "Curriculum API is waking up (attempt $attempt/10); retrying in 5 seconds"
            sleep 5
          done
          test "$ready" -eq 1

      - name: Launch app in Android emulator and test navigation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          system-image: google_apis_playstore
          profile: pixel_2
          # Keep the guest memory modest so the emulator does not starve the hosted runner.
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -no-snapshot-save -gpu swiftshader_indirect -memory 2048 -cores 2
          disable-animations: true
          emulator-boot-timeout: 420
          script: |
            echo "Checking emulator acceleration from the SDK provisioned by android-emulator-runner"
            "$ANDROID_HOME/emulator/emulator" -accel-check
            # Use the Play Store image so Google Text-to-Speech can be present;
            # the bare Google APIs image has repeatedly exposed no TTS service.
            # Never let a missing engine masquerade as a playback-controls failure.
            adb -s emulator-5554 shell settings delete secure tts_default_synth || true
            adb -s emulator-5554 shell pm list packages | grep -E 'com\\.google\\.android\\.tts|com\\.android\\.tts' || true
            tts_services="$(adb -s emulator-5554 shell cmd package query-services -a android.intent.action.TTS_SERVICE)"
            printf '%s\n' "$tts_services"
            if ! printf '%s\n' "$tts_services" | grep -q 'com.google.android.tts'; then
              echo "::error::No Google Text-to-Speech service is installed in the emulator. Refusing to run a misleading live-lesson smoke test."
              adb -s emulator-5554 shell pm list packages -s
              exit 1
            fi
            adb -s emulator-5554 shell settings put secure tts_default_synth com.google.android.tts
            adb -s emulator-5554 shell settings get secure tts_default_synth
            bash .github/scripts/android-ui-smoke-retry.sh

      - name: Upload emulator screenshots, UI trees, and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: padippupal-emulator-ui
          path: |
            ui-screenshots/
            attempt-artifacts/
            home.xml
            tutor.xml
            home-return.xml
            feedback.xml
            settings.xml
            chapter-options.xml
            chapter-menu.xml
            chapter-selected.xml
            ready-to-teach.xml
            live-lesson.xml
            live-resumed.xml
            live-checkpoint.xml
            live-continued.xml
            ui-screenshots/live-checkpoint.png
          if-no-files-found: warn
          retention-days: 14
