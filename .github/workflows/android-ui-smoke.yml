name: Android UI smoke test

on:
  push:
    branches: ["main", "feature/gentle-ai-tutor"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Launch app in Android emulator and test navigation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim
          disable-animations: true
          emulator-boot-timeout: 600
          script: bash .github/scripts/android-ui-smoke.sh

      - name: Upload emulator screenshots, UI trees, and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: padippupal-emulator-ui
          path: |
            ui-screenshots/
            home.xml
            tutor.xml
            home-return.xml
            feedback.xml
            settings.xml
          if-no-files-found: warn
          retention-days: 14
