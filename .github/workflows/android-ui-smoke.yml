name: Android UI smoke test

on:
  push:
    branches: ["main", "feature/gentle-ai-tutor"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

# Keep only the newest emulator run for this branch; cold Android emulators are expensive.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  emulator-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Install screenshot inspection dependency
        run: python3 -m pip install --user --disable-pip-version-check Pillow

      - name: Validate smoke-test scripts
        run: |
          bash -n .github/scripts/android-ui-smoke.sh
          python3 -m py_compile .github/scripts/ui_smoke.py

      - name: Launch app in Android emulator and test navigation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -wipe-data -gpu swiftshader_indirect
          disable-animations: true
          emulator-boot-timeout: 600
          disable-spellchecker: true
          script: bash .github/scripts/android-ui-smoke.sh

      - name: Upload emulator screenshots, UI trees, and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: padippupal-emulator-ui
          path: |
            ui-screenshots/
            home.xml
            tutor.xml
            home-return.xml
            feedback.xml
            settings.xml
            chapter-options.xml
            chapter-menu.xml
            chapter-selected.xml
            ready-to-teach.xml
            live-lesson.xml
          if-no-files-found: warn
          retention-days: 14
