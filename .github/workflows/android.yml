name: Android APK

on:
  push:
    branches: [ "main", "feature/gentle-ai-tutor" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish this tested APK as a public GitHub release (founder approval required)"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: PadippuPal-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Founder-approved public APK release
    needs: build
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.publish_release == true &&
      github.actor == github.repository_owner
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK built in this workflow run
        uses: actions/download-artifact@v4
        with:
          name: PadippuPal-debug-apk
          path: release-artifact
      - name: Publish explicitly approved APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test -s release-artifact/app-debug.apk
          gh release create "apk-build-${{ github.run_number }}" release-artifact/app-debug.apk \
            --title "PadippuPal APK build ${{ github.run_number }}" \
            --notes "Founder-approved public APK from commit ${{ github.sha }}."
