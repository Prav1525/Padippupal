name: Engineering Autopilot — failure observer

on:
  workflow_run:
    workflows:
      - "Android APK"
      - "Android UI smoke test"
      - "Curriculum Engine Tests"
      - "Investigation Guidance Gate"
      - "Deployed PadippuPal API Smoke Test"
    types: [completed]

# This observer never checks out or executes the triggering commit.
permissions:
  actions: read
  issues: write

concurrency:
  group: autopilot-failure-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
  cancel-in-progress: false

jobs:
  record-failure:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create or update a deduplicated failure record
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            if (!run) {
              core.setFailed("workflow_run payload missing");
              return;
            }

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const marker = "<!-- padippupal-autopilot-run:" + run.id + ":" + (run.run_attempt || 1) + " -->";

            let jobs = [];
            try {
              const response = await github.rest.actions.listJobsForWorkflowRun({
                owner, repo, run_id: run.id, per_page: 100
              });
              jobs = response.data.jobs || [];
            } catch (error) {
              core.warning("Could not retrieve job metadata: " + error.message);
            }

            const failed = jobs.filter(job =>
              ["failure", "timed_out", "action_required"].includes(job.conclusion)
            );
            const jobRows = jobs.map(job =>
              "- **" + job.name + "** — " + (job.conclusion || job.status) +
              (job.html_url ? " ([job log](" + job.html_url + "))" : "")
            ).join("\n") || "- Job metadata unavailable; inspect the workflow run.";

            const body = [
              marker,
              "## Automated CI failure record",
              "",
              "- Workflow: **" + run.name + "**",
              "- Run: " + run.html_url,
              "- Branch: `" + (run.head_branch || "unknown") + "`",
              "- Exact tested commit: `" + (run.head_sha || "unknown") + "`",
              "- Trigger: " + (run.event || "unknown"),
              "- Attempt: " + (run.run_attempt || 1),
              "- Conclusion: **" + run.conclusion + "**",
              "",
              "### Failed jobs",
              failed.length ? failed.map(job =>
                "- **" + job.name + "** — " + job.conclusion +
                (job.html_url ? " ([job log](" + job.html_url + "))" : "")
              ).join("\n") : "- No failed job metadata was returned.",
              "",
              "### All jobs",
              jobRows,
              "",
              "### Required handling",
              "1. Read `AGENTS.md`, `TESTING_GUIDANCE.md`, `PROJECT_STATUS.md`, and the relevant incident record.",
              "2. Inspect the first failing step and full logs/artifacts for this exact commit.",
              "3. Classify the cause as confirmed, probable, or unknown; do not treat keyword heuristics as a diagnosis.",
              "4. Only repair failures within an explicitly approved roadmap item and its acceptance criteria.",
              "5. Preserve assertions. Never skip tests or patch emulator-only failures without evidence.",
              "6. Record each repair generation. Maximum: **5**; escalate after the fifth unsuccessful generation.",
              "7. Open a reviewable PR for any code change. Never merge, deploy, write production data, or publish a release automatically.",
              "",
              "_This issue is an evidence record, not proof of root cause or a claim that an automatic repair has run._"
            ].join("\n");

            const existing = await github.rest.issues.listForRepo({
              owner, repo, state: "all", per_page: 100
            });
            const prior = existing.data.find(issue =>
              !issue.pull_request && issue.body && issue.body.includes(marker)
            );

            if (prior) {
              await github.rest.issues.update({
                owner, repo, issue_number: prior.number,
                title: "[Autopilot] " + run.name + " failed — run " + run.id,
                body
              });
              core.notice("Updated existing failure record #" + prior.number);
            } else {
              const created = await github.rest.issues.create({
                owner, repo,
                title: "[Autopilot] " + run.name + " failed — run " + run.id,
                body
              });
              core.notice("Created failure record " + created.data.html_url);
            }

            await core.summary
              .addHeading("Engineering Autopilot — failure recorded")
              .addTable([
                [{data:"Field",header:true},{data:"Value",header:true}],
                ["Workflow", run.name],
                ["Commit", run.head_sha || "unknown"],
                ["Failed jobs", failed.map(job => job.name).join(", ") || "metadata unavailable"],
                ["Source run", run.html_url],
                ["Repair policy", "Approved roadmap only; maximum five repair generations"],
                ["Release boundary", "No merge, deployment, production write, or public release"]
              ])
              .write();
