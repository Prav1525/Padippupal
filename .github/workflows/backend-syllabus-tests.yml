name: Backend Syllabus Synthesis Tests

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-syllabus-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
      - name: Run focused syllabus synthesis tests
        run: python -m pytest -q test_syllabus_synthesis.py
      - name: Run backend regression suite
        run: python -m pytest -q
