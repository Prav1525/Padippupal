name: Beyond Earth original-image emulator acceptance

on:
  pull_request:
    branches: ["main", "fix/beyond-earth-render-all-mapped-images"]
    paths:
      - ".github/scripts/beyond_earth_emulator_fixture.py"
      - ".github/scripts/test_beyond_earth_emulator.py"
      - ".github/scripts/test_beyond_earth_emulator_bootstrap.py"
      - ".github/scripts/beyond_earth_emulator_profile.py"
      - ".github/scripts/run_beyond_earth_emulator_acceptance.sh"
      - "app/src/main/**"
      - "app/build.gradle*"
      - ".github/workflows/beyond-earth-emulator-acceptance.yml"
      - "AGENTS.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Run deterministic checks and produce the exact APK on GitHub-hosted Linux.
  # This job must not depend on the scarce hardware-accelerated UI runner.
  validate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout acceptance branch
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Validate acceptance scripts and image mapping tests
        run: |
          python3 -m py_compile .github/scripts/beyond_earth_emulator_fixture.py .github/scripts/test_beyond_earth_emulator.py .github/scripts/test_beyond_earth_emulator_bootstrap.py .github/scripts/beyond_earth_emulator_profile.py
          python3 .github/scripts/test_beyond_earth_emulator_bootstrap.py
          bash -n .github/scripts/run_beyond_earth_emulator_acceptance.sh

      - name: Run Android JVM tests
        run: gradle --no-daemon -PPADIPPUPAL_API_BASE_URL=http://127.0.0.1:8765 testDebugUnitTest

      - name: Build exact debug APK for UI acceptance
        run: gradle --no-daemon -PPADIPPUPAL_API_BASE_URL=http://127.0.0.1:8765 assembleDebug

      - name: Preserve exact APK for the KVM UI job
        uses: actions/upload-artifact@v4
        with:
          name: beyond-earth-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 1

  # The UI job is deliberately isolated from hosted-runner build/test checks.
  # If no Linux KVM runner is registered, only actual device acceptance waits.
  beyond-earth-emulator:
    needs: validate-and-build
    runs-on: [self-hosted, linux, x64, kvm]
    timeout-minutes: 55
    steps:
      - name: Checkout acceptance branch
        uses: actions/checkout@v4

      - name: Download exact debug APK built by validation job
        uses: actions/download-artifact@v4
        with:
          name: beyond-earth-debug-apk
          path: app/build/outputs/apk/debug

      - name: Install screenshot inspection dependency
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check Pillow
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Start fixture with original image bytes fetched from production
        run: |
          python3 .github/scripts/beyond_earth_emulator_fixture.py > /tmp/beyond-earth-fixture.log 2>&1 &
          echo $! > /tmp/beyond-earth-fixture.pid
          ready=0
          for attempt in $(seq 1 300); do
            if curl --fail --silent --show-error --max-time 3 http://127.0.0.1:8765/health -o /tmp/beyond-earth-health.json; then
              cat /tmp/beyond-earth-health.json
              ready=1
              break
            fi
            if [ $((attempt % 10)) -eq 0 ]; then echo "Waiting for original-image fixture: ${attempt}/300 checks"; tail -n 8 /tmp/beyond-earth-fixture.log || true; fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then cat /tmp/beyond-earth-fixture.log; exit 1; fi

      - name: Launch hardware-accelerated Android emulator and inspect actual tutor screenshot
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_2
          cores: 4
          ram-size: 3072M
          emulator-boot-timeout: 600
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu host
          disable-animations: true
          script: python3 .github/scripts/test_beyond_earth_emulator.py

      - name: Upload Beyond Earth screenshots and diagnostic trees
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beyond-earth-original-image-emulator-evidence
          path: |
            ui-screenshots/beyond-earth/
            /tmp/beyond-earth-fixture.log
          if-no-files-found: warn
          retention-days: 14
