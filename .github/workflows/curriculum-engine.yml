name: Curriculum Engine Tests

on:
  push:
    branches: [ "main", "feature/gentle-ai-tutor" ]
    paths:
      - "backend/**"
      - ".github/workflows/curriculum-engine.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "backend/**"
      - ".github/workflows/curriculum-engine.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest -q
