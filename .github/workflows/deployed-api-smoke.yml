name: Deployed PadippuPal API Smoke Test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retrieve-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Wait for API to wake up
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            if curl --connect-timeout 10 --max-time 30 -fsS https://padippupal-curriculum-api.onrender.com/health >/tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            echo "API not ready yet (attempt $attempt/12); retrying in 10 seconds."
            sleep 10
          done
          echo "API health endpoint did not respond after retries."
          exit 1
      - name: Verify Class 6 CBSE Mathematics chapter outline
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl --connect-timeout 10 --max-time 30 --retry 3 --retry-all-errors --retry-delay 5 -fsS --get \
            --data-urlencode 'board=CBSE' \
            --data-urlencode 'class_level=6' \
            --data-urlencode 'subject=Mathematics' \
            --data-urlencode 'medium=English' \
            https://padippupal-curriculum-api.onrender.com/curriculum/outline)
          echo "$response"
          RESPONSE_JSON="$response" python - <<'PY'
          import json, os, sys
          payload = json.loads(os.environ["RESPONSE_JSON"])
          chapters = payload.get("chapters")
          if not isinstance(chapters, list):
              sys.exit("FAIL: /curriculum/outline response has no chapters array")
          if payload.get("chapter_count") != 10 or len(chapters) != 10:
              sys.exit(f"FAIL: expected 10 CBSE Class 6 Mathematics chapters, got chapter_count={payload.get('chapter_count')}, array_length={len(chapters)}")
          if chapters[0].get("title") != "Patterns in Mathematics":
              sys.exit(f"FAIL: first chapter should be Patterns in Mathematics, got {chapters[0].get('title')!r}")
          if len(chapters[0].get("topics", [])) < 5:
              sys.exit("FAIL: Patterns in Mathematics has fewer than five topic entries")
          print("PASS: deployed API returns all 10 CBSE Class 6 Mathematics chapters and the expected first chapter/topics.")
          PY
      - name: Verify retrieval returns the indexed test source
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl --connect-timeout 10 --max-time 30 --retry 3 --retry-all-errors --retry-delay 5 -fsS \
            -X POST https://padippupal-curriculum-api.onrender.com/retrieve \
            -H 'Content-Type: application/json' \
            --data '{"board":"CBSE","class_level":7,"subject":"Science","medium":"English","query":"How does preparation of soil help crops grow?","academic_year":"2026-27","edition":"PadippuPal-Test-1","limit":5}')
          echo "$response"
          RESPONSE_JSON="$response" python - <<'PY'
          import json, os, sys
          payload = json.loads(os.environ["RESPONSE_JSON"])
          matches = payload.get("matches")
          if not isinstance(matches, list):
              sys.exit("FAIL: response has no matches array")
          expected = [
              item for item in matches
              if item.get("source", {}).get("edition") == "PadippuPal-Test-1"
              and item.get("source", {}).get("board", "").lower() == "cbse"
              and item.get("source", {}).get("class_level") == 7
              and item.get("source", {}).get("subject", "").lower() == "science"
              and item.get("source", {}).get("medium", "").lower() == "english"
          ]
          if not expected:
              sys.exit("FAIL: indexed test source was not retrieved for the requested profile")
          print("PASS: API returned the indexed test source for CBSE / Class 7 / Science / English.")
          PY\n
      - name: Verify all approved lesson image assets and image bytes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          import struct
          import urllib.error
          import urllib.request
          from collections import Counter

          base = "https://padippupal-curriculum-api.onrender.com"
          with open("assets/lesson-images/authoring-manifest.json", encoding="utf-8") as handle:
              manifest = json.load(handle)
          expected_pairs = {
              (item["lesson_id"], item["module_key"])
              for item in manifest["images"]
          }
          expected_lessons = {lesson_id for lesson_id, _ in expected_pairs}
          if len(expected_pairs) != 170 or len(expected_lessons) != 22:
              raise SystemExit(
                  f"Manifest contract changed: {len(expected_pairs)} pairs / "
                  f"{len(expected_lessons)} lessons"
              )

          all_assets = []
          for lesson_id in sorted(expected_lessons):
              url = f"{base}/chapter-lessons/{lesson_id}/images"
              request = urllib.request.Request(url, headers={"Accept": "application/json"})
              with urllib.request.urlopen(request, timeout=45) as response:
                  if response.status != 200:
                      raise SystemExit(f"FAIL: image manifest HTTP {response.status}: {lesson_id}")
                  payload = json.load(response)
              if payload.get("lesson_id") != lesson_id or not isinstance(payload.get("images"), list):
                  raise SystemExit(f"FAIL: malformed image manifest for lesson {lesson_id}")
              all_assets.extend(payload["images"])

          actual_pairs = {(item["lesson_id"], item["module_key"]) for item in all_assets}
          if len(all_assets) != 172:
              raise SystemExit(f"FAIL: expected 172 ready assets, API returned {len(all_assets)}")
          if len({item.get("id") for item in all_assets}) != 172:
              raise SystemExit("FAIL: missing or duplicate asset IDs in production image manifests")
          if actual_pairs != expected_pairs:
              missing = sorted(expected_pairs - actual_pairs)
              extra = sorted(actual_pairs - expected_pairs)
              raise SystemExit(f"FAIL: lesson/module mapping mismatch; missing={missing}, extra={extra}")

          per_pair = Counter((item["lesson_id"], item["module_key"]) for item in all_assets)
          paired = {pair for pair, count in per_pair.items() if count == 2}
          if len(paired) != 2 or any(count not in (1, 2) for count in per_pair.values()):
              raise SystemExit(f"FAIL: expected exactly two paired modules; found {len(paired)}")

          for index, item in enumerate(all_assets, 1):
              image_url = item.get("url", "")
              expected_prefix = f"/chapter-lessons/{item['lesson_id']}/images/"
              if not image_url.startswith(expected_prefix) or ".." in image_url:
                  raise SystemExit(f"FAIL: unsafe or mismatched image URL for {item.get('id')}")
              request = urllib.request.Request(base + image_url, headers={"Accept": "image/png"})
              with urllib.request.urlopen(request, timeout=45) as response:
                  body = response.read()
                  content_type = response.headers.get_content_type()
                  if response.status != 200 or content_type != "image/png":
                      raise SystemExit(
                          f"FAIL: asset {item.get('id')} returned HTTP {response.status}, "
                          f"content-type={content_type}"
                      )
              if not body.startswith(b"\x89PNG\r\n\x1a\n"):
                  raise SystemExit(f"FAIL: asset {item.get('id')} is not a valid PNG")
              width, height = struct.unpack(">II", body[16:24])
              if (width, height) != (1080, 720):
                  raise SystemExit(
                      f"FAIL: asset {item.get('id')} dimensions are {width}x{height}, expected 1080x720"
                  )
              digest = hashlib.sha256(body).hexdigest()
              if digest != item.get("sha256"):
                  raise SystemExit(f"FAIL: SHA-256 mismatch for asset {item.get('id')}")
              if item.get("byte_length") != len(body):
                  raise SystemExit(f"FAIL: byte length mismatch for asset {item.get('id')}")
              if index % 25 == 0:
                  print(f"Verified {index}/{len(all_assets)} production PNGs")

          print(
              "PASS: 172/172 production PNGs are learner-visible, fetchable, "
              "SHA-256 verified, 1080x720, and mapped to all 170 manifest pairs "
              "across 22 approved lessons; both paired modules are present."
          )
          PY
