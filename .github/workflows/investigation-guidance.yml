name: Investigation Guidance Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  investigation-guidance:
    name: Investigation guidance and ledger
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Validate guidance and investigation record
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          # workflow_dispatch runs do not provide pull_request.base.sha or github.event.before.
          # Resolve a deterministic merge base against the default branch for PR-head checks.
          if [ -z "${BASE_SHA}" ]; then
            git fetch origin main --no-tags
            BASE_SHA="$(git merge-base origin/main "${HEAD_SHA}")"
          fi
          export BASE_SHA HEAD_SHA
          python3 .github/scripts/validate_investigation_ledger.py
