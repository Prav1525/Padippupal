name: Lesson visual renderer tests
on:
  pull_request:
    paths:
      - "tools/render_lesson_visuals.py"
      - "tools/test_render_lesson_visuals.py"
      - "tools/ingest_rendered_originals.py"
      - "tools/test_ingest_rendered_originals.py"
      - "assets/lesson-images/authoring-manifest.json"
      - ".github/workflows/lesson-visual-render-tests.yml"
  push:
    branches: [main]
    paths:
      - "tools/render_lesson_visuals.py"
      - "tools/test_render_lesson_visuals.py"
      - "assets/lesson-images/authoring-manifest.json"
      - ".github/workflows/lesson-visual-render-tests.yml"
jobs:
  render-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip Pillow pytest requests
      - run: python -m pytest -q tools/test_render_lesson_visuals.py tools/test_ingest_rendered_originals.py
      - run: python tools/render_lesson_visuals.py --manifest assets/lesson-images/authoring-manifest.json --out /tmp/padippupal-lesson-visuals
      - uses: actions/upload-artifact@v4
        with:
          name: padippupal-class6-lesson-visuals
          path: /tmp/padippupal-lesson-visuals
          if-no-files-found: error
