name: Project process guard

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main", "process/development-protocol"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  process-records:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate durable project records
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          PR_BODY: ${{ github.event.pull_request.body || '' }}
        run: python3 .github/scripts/check_project_process.py
