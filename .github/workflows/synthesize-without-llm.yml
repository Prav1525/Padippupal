name: Synthesize syllabus drafts without external LLM

on:
  push:
    branches:
      - feature/syllabus-synthesis-prototype
    paths:
      - backend/scripts/synthesize_without_llm.py
      - backend/test_synthesize_without_llm.py
      - backend/test_syllabus_synthesis.py
      - .github/workflows/synthesize-without-llm.yml
  workflow_dispatch:
    inputs:
      confirm_isolated_prototype:
        description: "Type GENERATE_DRAFTS to write draft lessons to the isolated prototype database"
        required: true
        type: string

permissions:
  contents: read

# Only one writer may synthesize into the isolated prototype DB at a time.
concurrency:
  group: padippupal-syllabus-synthesis-prototype
  cancel-in-progress: true

jobs:
  deterministic-synthesis:
    if: ${{ github.event_name == 'push' || inputs.confirm_isolated_prototype == 'GENERATE_DRAFTS' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/syllabus-synthesis-prototype
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Run synthesis and quality-gate unit tests
        working-directory: backend
        run: python -m unittest test_syllabus_synthesis test_synthesize_without_llm
      - name: Build and validate source-grounded drafts without Gemini
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.SYLLABUS_DATABASE_URL }}
        run: |
          set -euo pipefail
          test -n "$DATABASE_URL" || { echo "::error::Missing isolated SYLLABUS_DATABASE_URL secret"; exit 1; }
          python scripts/synthesize_without_llm.py
      - name: Verify persisted draft and citation coverage
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.SYLLABUS_DATABASE_URL }}
        run: |
          python - <<'PY'
          import json, os
          import psycopg
          from psycopg.rows import dict_row
          with psycopg.connect(os.environ["DATABASE_URL"], connect_timeout=10, row_factory=dict_row) as conn:
              lessons = conn.execute("""
                SELECT subject, status, model, lesson_json, source_refs_json
                FROM chapter_lessons
                WHERE board='CBSE' AND class_level=6 AND medium='English'
                  AND subject IN ('Mathematics','Science')
                  AND model='deterministic-extractive-v8-natural-tanglish'
              """).fetchall()
              assert len(lessons) == 22, f"Expected 22 deterministic drafts, found {len(lessons)}"
              assert all(r["status"] == "draft" for r in lessons), "Found a non-draft lesson"
              counts = {s: sum(1 for r in lessons if r["subject"] == s) for s in ("Mathematics","Science")}
              assert counts == {"Mathematics": 10, "Science": 12}, counts
              for row in lessons:
                  lesson = row["lesson_json"] if isinstance(row["lesson_json"], dict) else json.loads(row["lesson_json"])
                  refs = row["source_refs_json"] if isinstance(row["source_refs_json"], list) else json.loads(row["source_refs_json"])
                  allowed = {str(r["chunk_id"]) for r in refs}
                  validation_ids = set()
                  for c in lesson["concept_map"]:
                      validation_ids.update(c["source_chunk_ids"])
                  for step in lesson["teaching_sequence"]:
                      validation_ids.update(step["source_chunk_ids"])
                  assert allowed == validation_ids, f"Citation mismatch in {lesson['chapter_title']}"
                  assert lesson.get("human_review_required") is True
                  assert lesson.get("draft_method") == "deterministic-extractive-v8-natural-tanglish"
                  assert lesson.get("language_variants", {}).get("Tanglish", {}).get("available") is True
                  assert lesson.get("language_variants", {}).get("Tanglish", {}).get("human_review_required") is True
                  natural_starters = ("Seri", "Okay", "Nalla", "Ippo", "Sari", "Konjam", "Super", "Oru")
                  assert all(step["tanglish"]["teacher_says"].startswith(natural_starters) for step in lesson["teaching_sequence"])
                  assert all("un words-la sollu" in step["tanglish"]["example"] for step in lesson["teaching_sequence"])
                  assert all("confusing-aa irundhaa parava illa" in step["tanglish"]["misconception"] for step in lesson["teaching_sequence"])
                  assert 3 <= len(lesson.get("teaching_sequence", [])) <= 10
                  assert len(lesson.get("learning_objectives_tanglish", [])) == len(lesson.get("learning_objectives", []))
                  assert "natural conversational Tanglish" in lesson.get("language_variants", {}).get("Tanglish", {}).get("method", "")
                  assert "natural conversational Tanglish" in lesson.get("language_variants", {}).get("Tanglish", {}).get("method", "")
                  for step in lesson["teaching_sequence"]:
                      assert len(step.get("source_chunk_ids", [])) > 0
                      for field in ("teacher_says", "caption", "example", "checkpoint"):
                          assert len(step.get("tanglish", {}).get(field, "")) >= 35
                      assert len(step.get("caption", "")) <= 500
                      assert len(step.get("example", "")) <= 900
                      tanglish = step.get("tanglish", {})
                      assert tanglish.get("teacher_says", "").startswith(("Seri", "Okay", "Nalla", "Ippo", "Sari", "Konjam", "Super", "Oru"))
                      assert "unakku enna purinjuchu" in tanglish.get("teacher_says", "").lower()
                      assert "un words-la sollu" in tanglish.get("example", "").lower()
                      assert "confusing-aa irundhaa parava illa" in tanglish.get("misconception", "")
                      tanglish = step.get("tanglish", {})
                      assert tanglish.get("teacher_says", "").startswith(("Seri", "Okay", "Nalla", "Ippo", "Sari", "Konjam", "Super", "Oru"))
                      assert "unakku enna purinjuchu" in tanglish.get("teacher_says", "").lower()
                      assert "un words-la" in tanglish.get("example", "").lower()
              rounds = conn.execute("""
                SELECT count(*) AS n FROM syllabus_synthesis_rounds
                WHERE board='CBSE' AND class_level=6 AND subject IN ('Mathematics','Science')
                  AND curriculum_version='extractive-v8-natural-tanglish' AND status='draft'
              """).fetchone()["n"]
              assert rounds == 22, f"Expected 22 persisted synthesis rounds, found {rounds}"
              print("PASS: 10 Maths + 12 Science v8 topic-aware natural Tanglish drafts persisted; all remain draft; citations, pacing, and natural-voice quality gates verified.")
              print("NOTE: extractive summaries require teacher review; nothing was approved or deployed.")
          PY
