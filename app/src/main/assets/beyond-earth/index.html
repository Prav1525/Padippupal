<style>

<body><main id="app"><header class="top"><div class="brand">FIELD NOTES · BEYOND EARTH</div><div class="count" id="count">01 / 08</div></header><div id="progress"><div id="bar"></div></div><section id="canvas" aria-label="Interactive astronomy teaching drawing"><div id="dom-fallback" role="img" aria-label="Constellation star pattern teaching visual"><div class="sky-title" id="sky-title">A PATTERN IN THE NIGHT SKY</div><div class="sky-map"><i class="star s1"></i><i class="star s2"></i><i class="star s3"></i><i class="star s4"></i><i class="star s5"></i><i class="star s6"></i><i class="star s7"></i><span class="link l1"></span><span class="link l2"></span><span class="link l3"></span><span class="link l4"></span><span class="link l5"></span><span class="link l6"></span></div><div class="sky-label">STAR PATTERN</div></div><canvas id="fallback-canvas" aria-label="Hand-drawn astronomy visual" hidden></canvas></section><footer class="foot"><div class="caption" id="caption">A constellation is a recognizable pattern of stars.</div></footer></main>
<script>
/* Offline-safe first-paint renderer. PixiJS may replace this only after its module loads successfully. Canvas fallback remains available offline. */
(function(){
'use strict';
window.__padippuCanvasDiagnostics={scriptStarted:true,renderCalls:0,lastError:null};
window.onerror=function(message,source,line,column,error){window.__padippuCanvasDiagnostics.lastError=String(message)+' @ '+line+':'+column;console.error('PadippuPal canvas JS error:',window.__padippuCanvasDiagnostics.lastError);};
const root=document.getElementById('canvas'),canvas=document.getElementById('fallback-canvas'),ctx=canvas.getContext('2d');
const count=document.getElementById('count'),bar=document.getElementById('bar'),caption=document.getElementById('caption');
const ink='#35465b',gold='#e7b85d',blue='#6fa5bb',teal='#5c9b8c',coral='#d17b5b',paper='#f7f4ed',moon='#d9d4c8';
const scenes=[
['A PATTERN IN THE NIGHT SKY','A constellation is a recognizable pattern of stars seen from Earth.'],
['LOOK UP · OBSERVE · RECORD','Careful observation helps us notice and record patterns in the night sky.'],
['OUR SUN IS A STAR','The Sun is a star. It gives Earth light and heat.'],
['OUR SOLAR SYSTEM','Our solar system has the Sun and the objects that travel around it.'],
['PLANETS AND STARS','Stars make their own light. Planets reflect light from a star.'],
['EARTH AND ITS MOON','The Moon travels around Earth.'],
['ASTEROIDS AND COMETS','Asteroids are rocky objects; comets contain ice and dust.'],
['OUR HOME GALAXY · THE MILKY WAY','The Milky Way is the galaxy that contains our Solar System.']
];
const aliases={'beyond_earth_constellation':0,'beyond_earth_sky_watching':1,'beyond_earth_sun_star':2,'beyond_earth_solar_system':3,'beyond_earth_planet_star':4,'beyond_earth_earth_moon':5,'beyond_earth_asteroid_comet':6,'beyond_earth_milky_way':7,'beyond_earth_galaxy':7};
let step=0,subtype='',active='';
const defs={
 beyond_earth_sky_watching:{title:'LOOK UP · OBSERVE · RECORD',caption:'Observe patterns in the night sky.'}
};
defs.beyond_earth_day_night={title:'DAY AND NIGHT · EXCALIDRAW → PIXI',caption:'Earth rotates to create day and night.'};
function line(a,b,color=ink,w=2.3){ctx.strokeStyle=color;ctx.lineWidth=w;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke()}
function circle(x,y,r,fill,stroke=ink){ctx.fillStyle=fill;ctx.strokeStyle=stroke;ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();if(stroke)ctx.stroke()}
function label(t,x,y,size=13,color=ink){ctx.fillStyle=color;ctx.font='600 '+size+'px "Trebuchet MS",sans-serif';ctx.textAlign='center';ctx.fillText(t,x,y)}
function star(x,y,r=4){ctx.fillStyle=gold;ctx.strokeStyle=ink;ctx.lineWidth=1;ctx.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?r*.42:r;const px=x+Math.cos(a)*rr,py=y+Math.sin(a)*rr;i?ctx.lineTo(px,py):ctx.moveTo(px,py)}ctx.closePath();ctx.fill();ctx.stroke()}
function scene0(){const p=[[68,163],[121,105],[179,148],[237,83],[302,144],[253,220],[153,216]];p.forEach((v,i)=>{if(i)line(p[i-1],v,ink,2);star(v[0],v[1],5)});label('STAR PATTERN',190,275,12,teal)}
function scene1(){for(let i=0;i<34;i++)star(35+(i*67)%320,52+(i*43)%185,i%4===0?4:2.5);line([48,258],[342,258],teal,2);label('OBSERVE · RECORD · COMPARE',195,285,12,teal)}
function scene2(){circle(105,158,36,gold);for(let i=0;i<12;i++){let a=i*Math.PI/6;line([105+41*Math.cos(a),158+41*Math.sin(a)],[105+51*Math.cos(a),158+51*Math.sin(a)],gold,2)}for(let i=0;i<17;i++)star(258+Math.cos(i*2.4)*47,155+Math.sin(i*2.4)*53,2.7);label('OUR SUN',105,220,12);label('DISTANT STARS',258,235,12,teal)}
function scene3(){circle(195,160,18,gold);[42,68,94,121].forEach((r,i)=>{ctx.strokeStyle='#8793a1';ctx.lineWidth=1.5;ctx.beginPath();ctx.ellipse(195,160,r,r*.57,0,0,Math.PI*2);ctx.stroke();const a=[1.1,2.5,3.8,5.1][i];circle(195+Math.cos(a)*r,160+Math.sin(a)*r*.57,5+i%2*2,[moon,gold,blue,coral][i])});label('SUN + PLANETS',195,282,12,teal)}
function scene4(){circle(100,153,29,gold);circle(285,153,25,blue);line([142,153],[244,153],gold,3);label('STAR',100,207,12,teal);label('PLANET',285,207,12,teal);label('Makes its own light',100,235,10);label('Reflects light',285,235,10)}
function scene5(){circle(185,155,43,blue);ctx.fillStyle=teal;ctx.beginPath();ctx.ellipse(174,145,12,7,-.4,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(199,174,15,8,.5,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#8793a1';ctx.beginPath();ctx.ellipse(185,155,111,69,0,0,Math.PI*2);ctx.stroke();circle(296,155,15,moon);label('EARTH',185,220,12);label('MOON',296,190,11)}
function scene6(){for(let i=0;i<18;i++)circle(105+Math.cos(i*2.4)*(35+(i%5)*9),155+Math.sin(i*2.4)*(27+(i%5)*7),2+i%3,'#8793a6','#8793a6');circle(278,157,13,moon);line([263,149],[205,119],blue,4);line([263,163],[220,193],teal,2);label('ASTEROIDS',105,252,12);label('COMET',278,208,11)}
function scene7(){circle(195,160,7,gold);for(let arm=0;arm<3;arm++){let prev=null;for(let i=1;i<=70;i++){let t=i/70,a=arm*Math.PI*2/3+t*5.7,r=8+t*105,p=[195+Math.cos(a)*r,160+Math.sin(a)*r*.43];if(prev&&i%3===0)line(prev,p,arm===1?teal:blue,1.8);if(i%7===0)star(p[0],p[1],i%14===0?3:1.8);prev=p}}label('MILKY WAY',195,285,13,teal)}
const drawers=[scene0,scene1,scene2,scene3,scene4,scene5,scene6,scene7];
function render(){window.__padippuCanvasDiagnostics.renderCalls++;const w=Math.max(1,root.clientWidth),h=Math.max(160,root.clientHeight,window.innerHeight||0,document.documentElement.clientHeight||0);if(root.clientHeight<h)root.style.height=h+'px';if(document.getElementById('app').clientHeight<h)document.getElementById('app').style.height=h+'px';const dpr=Math.min(window.devicePixelRatio||1,2);canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);canvas.style.width=w+'px';canvas.style.height=h+'px';ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle=paper;ctx.fillRect(0,0,w,h);const s=Math.min(w/390,h/320);ctx.save();ctx.translate((w-390*s)/2,(h-320*s)/2);ctx.scale(s,s);label(scenes[step][0],195,24,11,teal);drawers[step]();ctx.restore();window.__padippuCanvasDiagnostics.lastRender={step,w,h,canvasWidth:canvas.width,canvasHeight:canvas.height,appHeight:document.getElementById('app').clientHeight,viewportHeight:window.innerHeight,rootClientHeight:root.clientHeight,rootRectHeight:root.getBoundingClientRect().height,context:!!ctx};count.textContent=String(step+1).padStart(2,'0')+' / 08';bar.style.width=((step+1)/8*100)+'%';caption.textContent=scenes[step][1]}
function setStep(n,s){subtype=typeof s==='string'?s:'';step=Number.isFinite(Number(n))?Math.max(0,Math.min(7,Number(n))):0;if(subtype==='beyond_earth_galaxy'){active='beyond_earth_milky_way';step=7}else if(subtype in aliases){active=Object.keys(aliases).find(k=>aliases[k]===aliases[subtype])||'';step=aliases[subtype]}window.__padippuFallbackState={step,subtype};render()}
window.PadippuPalVisual={setStep,getStep:()=>step,setSubtype:s=>{if(s in aliases)setStep(aliases[s],s)}};
// Keep the chapter subtype mapping explicit for the Android WebView bridge.
// If a PixiJS renderer is added later, its asynchronous initialization must be guarded:
// await app.init({ background: '#f7f4ed', antialias: true });
const fallbackCanvas=canvas;
window.addEventListener('resize',()=>requestAnimationFrame(render));
// Android WebView can run module scripts before AndroidView has its final measured size.
// A one-shot render at that moment writes 1x1 inline canvas dimensions; resize is not
// guaranteed to fire when the enclosing Compose view finishes layout. Observe the actual
// drawing viewport and repaint once it has a non-zero size, then recheck after first paint.
if('ResizeObserver' in window){new ResizeObserver(()=>{if(root.clientWidth>1)requestAnimationFrame(render)}).observe(root)}
const pending=window.__padippuFallbackState;
requestAnimationFrame(()=>requestAnimationFrame(()=>setStep(pending?.step??0,pending?.subtype??'')));
// Keep the deterministic 2D canvas visible unless a Pixi renderer has actually
// mounted and painted. Merely having window.PIXI defined is not proof that a renderer
// exists; hiding this canvas on that signal alone produced a blank paper-coloured view.
fallbackCanvas.hidden=true;
fallbackCanvas.style.display='none';
const domFallback=document.getElementById('dom-fallback');
const skyTitle=document.getElementById('sky-title');
const starSets={0:['A PATTERN IN THE NIGHT SKY','STAR PATTERN'],1:['LOOK UP · OBSERVE · RECORD','OBSERVE · RECORD · COMPARE'],2:['OUR SUN IS A STAR','SUNLIGHT AND DISTANT STARS'],3:['OUR SOLAR SYSTEM','SUN + PLANETS'],4:['PLANETS AND STARS','STAR LIGHT · PLANET REFLECTION'],5:['EARTH AND ITS MOON','EARTH · MOON ORBIT'],6:['ASTEROIDS AND COMETS','SMALL SOLAR-SYSTEM OBJECTS'],7:['OUR HOME GALAXY · THE MILKY WAY','MILKY WAY']};
const originalSetStep=setStep;
setStep=function(n,s){originalSetStep(n,s);const scene=starSets[step]||starSets[0];skyTitle.textContent=scene[0];domFallback.querySelector('.sky-label').textContent=scene[1];domFallback.setAttribute('aria-label',scene[0]+'. '+scene[1]);};
domFallback.style.display='flex';
setStep(0,'');

})();
</script></body></html>
