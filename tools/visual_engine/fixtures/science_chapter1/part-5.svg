<svg xmlns="http://www.w3.org/2000/svg" width="720" height="280" viewBox="0 0 720 280" role="img" aria-labelledby="title desc"><title id="title">The Wonderful World of Science — Part 4</title><desc id="desc">Draft original visual for Grade 6 Science. Teacher review required.</desc><rect width="720" height="280" rx="16" fill="#FFFFFF"/><text x="24" y="34" font-family="sans-serif" font-size="19" font-weight="700" fill="#25364A">The Wonderful World of Science — Part 4</text><g font-family="sans-serif" fill="#25364A"><rect x="35" y="108" width="145" height="22" rx="8" transform="rotate(-10 35 108)" fill="#E7F0FF" stroke="#4C83D6" stroke-width="3"/><text x="45" y="164" font-size="15">Pen stops writing</text><path d="M195 120 H250 M240 110 L252 120 L240 130" fill="none" stroke="#4C83D6" stroke-width="3"/><rect x="270" y="82" width="155" height="70" rx="10" fill="#FFF0D9" stroke="#E7A34B" stroke-width="2"/><text x="347" y="109" text-anchor="middle" font-size="14">Possible guess</text><text x="347" y="131" text-anchor="middle" font-size="13">Ink is empty</text><path d="M435 120 H480 M470 110 L482 120 L470 130" fill="none" stroke="#3C9B78" stroke-width="3"/><rect x="500" y="82" width="175" height="70" rx="10" fill="#E4F5ED" stroke="#3C9B78" stroke-width="2"/><text x="587" y="109" text-anchor="middle" font-size="14">Test the guess</text><text x="587" y="131" text-anchor="middle" font-size="13">Check refill</text><text x="45" y="220" font-size="13" fill="#64748B">If evidence disagrees, make another guess and test it.</text></g></svg>
