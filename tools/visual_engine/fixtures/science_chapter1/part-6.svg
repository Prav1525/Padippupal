<svg xmlns="http://www.w3.org/2000/svg" width="720" height="280" viewBox="0 0 720 280" role="img" aria-labelledby="title desc"><title id="title">The Wonderful World of Science — Part 5</title><desc id="desc">Draft original visual for Grade 6 Science. Teacher review required.</desc><rect width="720" height="280" rx="16" fill="#FFFFFF"/><text x="24" y="34" font-family="sans-serif" font-size="19" font-weight="700" fill="#25364A">The Wonderful World of Science — Part 5</text><g font-family="sans-serif" fill="#25364A" text-anchor="middle"><rect x="52" y="105" width="88" height="62" rx="10" fill="#F7F9FC" stroke="#4C83D6" stroke-width="2"/><text x="96" y="142" font-size="13" font-weight="700">Observe</text><path d="M142 136 H177 M167 126 L179 136 L167 146" fill="none" stroke="#E7A34B" stroke-width="3"/><rect x="187" y="105" width="88" height="62" rx="10" fill="#E7F0FF" stroke="#3C9B78" stroke-width="2"/><text x="231" y="142" font-size="13" font-weight="700">Ask</text><path d="M277 136 H312 M302 126 L314 136 L302 146" fill="none" stroke="#E7A34B" stroke-width="3"/><rect x="322" y="105" width="88" height="62" rx="10" fill="#F7F9FC" stroke="#4C83D6" stroke-width="2"/><text x="366" y="142" font-size="13" font-weight="700">Guess</text><path d="M412 136 H447 M437 126 L449 136 L437 146" fill="none" stroke="#E7A34B" stroke-width="3"/><rect x="457" y="105" width="88" height="62" rx="10" fill="#E7F0FF" stroke="#3C9B78" stroke-width="2"/><text x="501" y="142" font-size="13" font-weight="700">Test</text><path d="M547 136 H582 M572 126 L584 136 L572 146" fill="none" stroke="#E7A34B" stroke-width="3"/><rect x="592" y="105" width="88" height="62" rx="10" fill="#F7F9FC" stroke="#4C83D6" stroke-width="2"/><text x="636" y="142" font-size="13" font-weight="700">Analyse</text><text x="52" y="208" font-size="14">Use results to check whether the guess answers the question.</text><text x="52" y="235" font-size="12" fill="#64748B">The source describes observing, questioning, guessing, testing and analysing.</text></g></svg>
